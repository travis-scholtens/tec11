name: Deploy Web Build to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Spago packages
        uses: actions/cache@v4
        with:
          path: .spago
          key: spago-${{ runner.os }}-${{ hashFiles('spago.dhall', 'packages.dhall') }}

      - name: Cache Bazel disk & repository cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazel-repo-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'crates/**/Cargo.toml', 'proto/*.proto') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Install PureScript (Spago) dependencies
        run: npx spago install

      - name: Build web bundle with Bazel
        run: |
          mkdir -p ~/.cache/bazel-disk-cache ~/.cache/bazel-repo-cache
          bazel build -c opt \
            --incompatible_strict_action_env \
            --disk_cache=~/.cache/bazel-disk-cache \
            --repository_cache=~/.cache/bazel-repo-cache \
            //:web_bundle

      - name: Stage GitHub Pages site
        run: |
          mkdir -p _site
          cp bazel-bin/dist/index.html _site/index.html
          cp bazel-bin/dist/bundle.js _site/bundle.js
          cp bazel-bin/dist/tec11_wasm_bg.wasm _site/tec11_wasm_bg.wasm
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
