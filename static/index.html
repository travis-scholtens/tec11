<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tec11 — Planetary Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #070a14;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .main-menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 3rem 4rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      min-width: 320px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }
    .menu-accordion {
      display: flex;
      flex-direction: column;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      overflow: hidden;
      width: 100%;
    }
    .menu-accordion-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 1rem;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #93c5fd;
      background: #1e293b;
      border: none;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: background 0.15s ease;
    }
    .menu-accordion-header:hover {
      background: #334155;
    }
    .menu-accordion-body {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.75rem;
    }
    .menu-btn,
    .action-btn {
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
      width: 100%;
    }
    .menu-btn:hover:not(:disabled),
    .action-btn:hover:not(:disabled) {
      background: #1d4ed8;
    }
    .menu-btn:disabled,
    .action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .action-btn.secondary {
      background: #334155;
    }
    .action-btn.secondary:hover:not(:disabled) {
      background: #475569;
    }
    .mode-layout {
      display: flex;
      flex-direction: row;
      gap: 2rem;
      align-items: flex-start;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .viewport-column {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }
    .canvas-container {
      background: #050505;
      border: 1px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
    }
    .sphere-canvas {
      width: 460px;
      height: 460px;
      display: block;
    }
    .slider-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
    }
    .rotate-slider {
      flex: 1;
      accent-color: #3b82f6;
      cursor: pointer;
    }
    .rotate-slider:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .slider-inline-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      min-width: 5.2rem;
    }
    .rotation-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      color: #94a3b8;
      min-width: 3.5rem;
      text-align: right;
    }
    .sidebar-column {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      width: 180px;
    }
    .pangea-sidebar {
      width: 230px;
    }
    .tectonics-sidebar {
      width: 310px;
    }
    .button-row {
      display: flex;
      flex-direction: row;
      gap: 0.6rem;
      width: 100%;
    }
    .interactive-canvas {
      cursor: crosshair;
    }
    .stat-subtle {
      color: #93c5fd;
      font-size: 0.85rem;
    }
    .tile-details-box {
      background: #0b1021;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.76rem;
      line-height: 1.38;
      color: #cbd5e1;
      min-height: 135px;
      max-height: 175px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .species-list-box {
      background: #0b1021;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.45rem;
      min-height: 180px;
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .species-item-btn {
      text-align: left;
      padding: 0.35rem 0.55rem;
      font-size: 0.8rem;
      color: #cbd5e1;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
    }
    .species-item-btn:hover {
      background: #1e293b;
    }
    .species-item-btn.selected {
      background: #064e3b;
      border-color: #10b981;
      color: #a7f3d0;
      font-weight: 600;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .control-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    .control-select {
      padding: 0.5rem 0.65rem;
      background: #0b1021;
      color: #e2e8f0;
      border: 1px solid #1e293b;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .grid-stats {
      background: #0b1021;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .stat-line {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      color: #e2e8f0;
    }
    .language-columns {
      display: flex;
      flex-direction: row;
      gap: 1.25rem;
      min-width: 560px;
    }
    .language-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      min-width: 260px;
    }
    .language-phonemes-box {
      background: #0b1021;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      color: #93c5fd;
      line-height: 1.4;
      min-height: 54px;
    }
    .language-word-list {
      background: #0b1021;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.55rem;
      max-height: 410px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .language-word-row {
      padding: 0.35rem 0.55rem;
      border-radius: 6px;
      background: #111827;
      border: 1px solid #1f2937;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .language-word-main {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.9rem;
      font-weight: 600;
      color: #f8fafc;
    }
    .language-word-ipa {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      font-weight: 400;
      color: #94a3b8;
    }
    .language-word-etym {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.74rem;
      color: #6ee7b7;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
