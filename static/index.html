<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tec11 — Planetary Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #070a14;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app-shell {
      display: flex;
      flex-direction: row;
      gap: 2rem;
      align-items: center;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      max-width: 960px;
    }
    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 340px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .badge.ready {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }
    .badge.loading {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }
    .hello-btn {
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .hello-btn:hover:not(:disabled) {
      background: #1d4ed8;
    }
    .hello-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .wasm-output {
      padding: 1rem;
      background: #0b1021;
      border: 1px solid #1e293b;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      color: #60a5fa;
      min-height: 4.5rem;
      display: flex;
      align-items: center;
    }
    .viewport-panel {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .three-canvas {
      width: 520px;
      height: 420px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      display: block;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
